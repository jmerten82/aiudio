[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "aiudio"
version = "0.0.1"
description = "AI-native digital audio processing framework — Python bindings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# `pip install -e ".[test]"` (or `pip install -r testing/python/requirements-dev.txt`).
test = ["pytest>=8.0", "ruff>=0.5", "nbconvert>=7.0", "jupyter-client>=8.0", "ipykernel>=6.0", "matplotlib>=3.7"]
# The differentiable / ML layer (Phase 1, ADR-0016/0017): `pip install -e ".[diff]"`.
# Kept optional so the base package stays lightweight (the RT core needs no torch).
diff = ["torch>=2.0"]
# The Phase 2 workbench server (ADR-0019): `pip install -e ".[workbench]"` — a localhost
# FastAPI/WebSocket bridge serving the engine to the browser. Optional; the base package and the
# RT core need none of it. (httpx backs the in-process ASGI test client.)
workbench = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[tool.ruff]
# Notebooks intentionally use REPL idioms (semicolon-joined statements, mid-notebook
# imports, display-only expressions); they are verified by *execution*
# (testing/python/test_notebook.py), not by lint.
extend-exclude = ["*.ipynb"]

[tool.pytest.ini_options]
# Test code lives in a dedicated testing/ folder (the Phase-0 strategy) plus the
# binding unit tests next to the bindings. See testing/README.md.
testpaths = ["testing/python", "bindings"]
markers = [
    "live: needs a real audio output device — set AIUDIO_LIVE=1 (macOS); skipped otherwise",
    "slow: slow tests (e.g. executing the tour notebook end to end)",
]
addopts = "-ra"

[tool.scikit-build]
minimum-version = "0.10"
# Build only the Python module (skip C++ tests/examples) and place _aiudio inside
# the aiudio package.
cmake.args = [
    "-DAIUDIO_BUILD_PYTHON=ON",
    "-DAIUDIO_BUILD_TESTS=OFF",
    "-DAIUDIO_BUILD_EXAMPLES=OFF",
]
wheel.packages = ["python/aiudio"]
